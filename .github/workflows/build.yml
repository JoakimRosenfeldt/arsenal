name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  laya-model:
    name: Prepare offline Laya model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - uses: actions/cache@v4
        with:
          path: assets/laya
          key: laya-${{ hashFiles('scripts/prepare-laya.*') }}

      - name: Export and verify Laya
        run: node scripts/prepare-laya.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: laya-model
          path: assets/laya
          if-no-files-found: error
          compression-level: 0

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: laya-model
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARSENAL_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      ONNXRUNTIME_NODE_INSTALL: skip
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tags must match package.json: vMAJOR.MINOR.PATCH');
          }
          NODE

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: laya-model
          path: assets/laya
      - run: node scripts/prepare-laya.cjs --check
      - run: node scripts/prepare-laya-runtime.mjs
      - run: npm run typecheck
      - run: npm run lint

      - name: Build app
        if: runner.os != 'macOS' || env.ARSENAL_RELEASE != 'true'
        run: npm run make

      - name: Build signed macOS release
        if: runner.os == 'macOS' && env.ARSENAL_RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing signing secret: $name. See docs/releases.md." >&2
              exit 1
            fi
          done
          npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: arsenal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest-*.yml
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arsenal-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: laya-model
          path: laya-model

      - name: Publish shared Laya model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          model_tag=$(node <<'NODE'
          const { createHash } = require('node:crypto');
          const manifest = require('./laya-model/manifest.json');
          const filesHash = createHash('sha256').update(JSON.stringify(manifest.files)).digest('hex');
          console.log(`laya-${manifest.modelRevision.slice(0, 12)}-${filesHash.slice(0, 12)}`);
          NODE
          )
          if ! gh release view "$model_tag" --json isDraft --jq .isDraft > model-draft.txt; then
            gh release create "$model_tag" --target "$GITHUB_SHA" \
              --title "Laya model $model_tag" \
              --notes 'Shared Laya model files for Arsenal. The app verifies each download against its embedded manifest.' \
              --draft --prerelease --latest=false
            echo true > model-draft.txt
          fi
          if [ "$(cat model-draft.txt)" = true ]; then
            mkdir model-upload
            for file in laya-model/*; do
              ln "$file" "model-upload/laya-$(basename "$file")"
            done
            gh release upload "$model_tag" model-upload/* --clobber
          fi
          gh api "repos/$GH_REPO/releases/tags/$model_tag" > model-release.json
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const manifestBytes = readFileSync('laya-model/manifest.json');
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const release = JSON.parse(readFileSync('model-release.json', 'utf8'));
          if (!release.prerelease) throw new Error('The model release must be a prerelease.');
          const files = {
            ...manifest.files,
            'manifest.json': {
              bytes: manifestBytes.length,
              sha256: createHash('sha256').update(manifestBytes).digest('hex'),
            },
          };
          for (const [name, expected] of Object.entries(files)) {
            const asset = release.assets.find((file) => file.name === `laya-${name}`);
            if (!asset || asset.state !== 'uploaded' || asset.size !== expected.bytes || asset.digest !== `sha256:${expected.sha256}`) {
              throw new Error(`The model release has a missing or mismatched asset: laya-${name}`);
            }
          }
          NODE
          if [ "$(cat model-draft.txt)" = true ]; then
            gh release edit "$model_tag" --draft=false --prerelease --latest=false
          fi

      - name: Publish completed builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > is-draft.txt; then
            if [ "$(cat is-draft.txt)" != true ]; then
              echo 'This version is already published. Create a new version tag.' >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
