<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <% if (webpackConfig.mode === 'production') { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'"
    />
    <% } %>
    <title>Cuebox</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to workspace</a>
    <div id="root"></div>
  </body>
</html>
